<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mein Schrank</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FB0FF}a:hover{color:#B9CEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F13; color: #F2F3F5; font-family: Inter, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">
  <div style="padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #A3A8B5; font-weight: 500">Hallo, [SPITZNAME]</span>
        <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">Mein Schrank</h1>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px">
        <span style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700">{{count}}</span>
        <span style="font-size: 12px; color: #A3A8B5">Teile</span>
      </div>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; background: #181A21; border: 1px solid #2C303B; border-radius: 14px; padding: 0 14px; height: 48px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A3A8B5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <span style="position: absolute; left: -9999px">Suchen</span>
      <input type="search" placeholder="Suchen: Marke, Farbe …" style="flex: 1; background: transparent; border: 0; color: #F2F3F5; font: inherit; font-size: 15px; outline: none">
    </label>
    <div style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 4px 20px 120px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <a href="anzeige.html" style="text-decoration: none; color: #F2F3F5; background: #181A21; border: 1px solid #2C303B; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column">
          <div style="{{it.bg}}">
            <sc-if value="{{it.isShirt}}" hint-placeholder-val="{{true}}">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M8 3L3 5.5 1.5 10.5 5 11.5V21h14v-9.5l3.5-1L21 5.5 16 3c0 2-1.8 3.2-4 3.2S8 5 8 3z"></path></svg>
            </sc-if>
            <sc-if value="{{it.isShoe}}" hint-placeholder-val="{{false}}">
              <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M2 17.5h20M2 17.5V9.5l4 1.5 3-3 2.5 2.5c3 1.5 7 1.5 9.5 3.5 1 .8 1 2.5 1 3.5"></path><path d="M9 11l1 1.5M11 9.5l1 1.5"></path></svg>
            </sc-if>
            <sc-if value="{{it.isPants}}" hint-placeholder-val="{{false}}">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.85)" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5h11L19 21.5h-4.5L12 9.5l-2.5 12H5z"></path></svg>
            </sc-if>
            <sc-if value="{{it.sell}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 10px; left: 10px; background: #2A1218; color: #FF9AAA; border: 1px solid #5A2230; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px">Verkaufen</span>
            </sc-if>
          </div>
          <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
            <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #A3A8B5">
              <span style="{{it.dot}}"></span>{{it.meta}}
            </span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
  <nav aria-label="Hauptnavigation" style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 72px; background: rgba(24,26,33,0.92); border: 1px solid #2C303B; border-radius: 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; backdrop-filter: blur(12px)">
    <a href="schrank.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #F2F3F5; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a2 2 0 1 1 2 2c-1 0-2 .8-2 2v1M12 9L2.5 16.5c-.8.6-.4 2 .6 2h17.8c1 0 1.4-1.4.6-2z"></path></svg>Schrank</a>
    <a href="outfit.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A8B5; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg>Outfits</a>
    <a href="erfassen.html" aria-label="Neues Teil fotografieren" style="justify-self: center; width: 58px; height: 58px; border-radius: 20px; background: {{accent}}; display: flex; align-items: center; justify-content: center; color: #FFFFFF; box-shadow: 0 8px 24px rgba(53,99,240,0.45)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
    </a>
    <a href="anzeige.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A8B5; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8" r="1.5"></circle></svg>Verkaufen</a>
    <a href="schrank.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #A3A8B5; font-size: 11px; font-weight: 500">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Bilanz</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3563F0","options":["#3563F0","#C8324B","#14A38B","#F2F3F5"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { filter: 'Alle' }; }
  renderVals() {
    const accent = this.props.accent ?? '#3563F0';
    const all = [
      { name: 'Heimtrikot 23/24', meta: 'M · Blau/Granat', cat: 'Trikots', kind: 'shirt', c1: '#1E3F9A', c2: '#7A1E33', dot: '#3D6BFF', sell: true },
      { name: 'Retro Sneaker', meta: '43 · Weiß', cat: 'Schuhe', kind: 'shoe', c1: '#3A3D46', c2: '#23252C', dot: '#F2F3F5', sell: false },
      { name: 'Oversize Hoodie', meta: 'L · Olive', cat: 'Oberteile', kind: 'shirt', c1: '#3E4A2C', c2: '#262D1C', dot: '#8C9A62', sell: false },
      { name: 'Cargo Pants', meta: '32 · Schwarz', cat: 'Hosen', kind: 'pants', c1: '#2A2C33', c2: '#18191E', dot: '#5B5F6B', sell: false },
      { name: 'Auswärtstrikot', meta: 'M · Gelb', cat: 'Trikots', kind: 'shirt', c1: '#8A6A12', c2: '#4A3808', dot: '#E3B52B', sell: true },
      { name: 'Running Shoes', meta: '43 · Grau', cat: 'Schuhe', kind: 'shoe', c1: '#2E3B4E', c2: '#1A222E', dot: '#7C8FA8', sell: false }
    ];
    const f = this.state.filter;
    const shown = all.filter(i => f === 'Alle' || (f === 'Verkaufen' ? i.sell : i.cat === f));
    const labels = ['Alle', 'Oberteile', 'Hosen', 'Schuhe', 'Trikots', 'Verkaufen'];
    const chips = labels.map(l => ({
      label: l,
      pick: () => this.setState({ filter: l }),
      style: 'flex: none; height: 40px; padding: 0 16px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (l === f ? 'background: #F2F3F5; color: #0E0F13; border: 1px solid #F2F3F5' : 'background: #181A21; color: #C9CDD6; border: 1px solid #2C303B')
    }));
    const items = shown.map(i => ({
      ...i,
      isShirt: i.kind === 'shirt', isShoe: i.kind === 'shoe', isPants: i.kind === 'pants',
      bg: 'position: relative; height: 150px; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 30% 25%, ' + i.c1 + ', ' + i.c2 + ')',
      dot: 'width: 10px; height: 10px; border-radius: 50%; background: ' + i.dot + '; border: 1px solid rgba(255,255,255,0.25)'
    }));
    return { accent, chips, items, count: all.length };
  }
}
</script>
</body>
</html>
