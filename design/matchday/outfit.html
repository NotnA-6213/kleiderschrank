<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kombinieren</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8FB0FF}a:hover{color:#B9CEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0E0F13; color: #F2F3F5; font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <div style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="schrank.html" aria-label="Zurück zum Schrank" style="width: 44px; height: 44px; border-radius: 14px; background: #181A21; border: 1px solid #2C303B; display: flex; align-items: center; justify-content: center; color: #F2F3F5">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700">Kombinieren</h1>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; background: #142033; border: 1px solid #24406B; border-radius: 16px; padding: 12px 14px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#8FB0FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17a4.5 4.5 0 1 1 1-8.9A6 6 0 0 1 19 10a3.5 3.5 0 0 1-.5 7z"></path><path d="M9 20l-1 2M13 20l-1 2M17 20l-1 2"></path></svg>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 600">8 °C · Regen</span>
        <span style="font-size: 13px; color: #B8C6E3">Heute lieber mit Jacke</span>
      </div>
    </div>
  </div>
  <div style="flex: 1; padding: 4px 20px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px">
        <button onClick="{{r.prev}}" aria-label="Vorheriges Teil" style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: #181A21; border: 1px solid #2C303B; color: #C9CDD6; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
        </button>
        <div style="{{r.box}}">
          <sc-if value="{{r.isShirt}}" hint-placeholder-val="{{true}}">
            <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M8 3L3 5.5 1.5 10.5 5 11.5V21h14v-9.5l3.5-1L21 5.5 16 3c0 2-1.8 3.2-4 3.2S8 5 8 3z"></path></svg>
          </sc-if>
          <sc-if value="{{r.isPants}}" hint-placeholder-val="{{false}}">
            <svg width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5h11L19 21.5h-4.5L12 9.5l-2.5 12H5z"></path></svg>
          </sc-if>
          <sc-if value="{{r.isShoe}}" hint-placeholder-val="{{false}}">
            <svg width="96" height="80" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.88)" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M2 17.5h20M2 17.5V9.5l4 1.5 3-3 2.5 2.5c3 1.5 7 1.5 9.5 3.5 1 .8 1 2.5 1 3.5"></path></svg>
          </sc-if>
          <span style="position: absolute; left: 12px; bottom: 10px; font-size: 12px; font-weight: 600; background: rgba(14,15,19,0.75); padding: 4px 9px; border-radius: 999px">{{r.name}}</span>
          <span style="position: absolute; right: 12px; top: 10px; font-size: 11px; color: #C9CDD6; background: rgba(14,15,19,0.6); padding: 3px 8px; border-radius: 999px">{{r.pos}}</span>
        </div>
        <button onClick="{{r.next}}" aria-label="Nächstes Teil" style="flex: none; width: 44px; height: 44px; border-radius: 14px; background: #181A21; border: 1px solid #2C303B; color: #C9CDD6; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </div>
    </sc-for>
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A3A8B5; padding: 4px 2px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9FE3C8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4.5 4.5L19 7"></path></svg>
      <span>{{hint}}</span>
    </div>
  </div>
  <div style="padding: 12px 20px 28px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
    <button onClick="{{roll}}" style="height: 56px; border-radius: 18px; background: #181A21; border: 1px solid #2C303B; color: #F2F3F5; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor"></circle></svg>Überrasch mich</button>
    <button style="height: 56px; border-radius: 18px; background: #3563F0; border: 0; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>Outfit merken</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { i: [0, 0, 0] }; }
  renderVals() {
    const sets = [
      [{ name: 'Oversize Hoodie', kind: 'shirt', c: ['#3E4A2C', '#262D1C'] }, { name: 'Heimtrikot', kind: 'shirt', c: ['#1E3F9A', '#7A1E33'] }, { name: 'Basic Tee Weiß', kind: 'shirt', c: ['#5B5E66', '#33353B'] }],
      [{ name: 'Cargo Pants', kind: 'pants', c: ['#2A2C33', '#18191E'] }, { name: 'Jeans Blau', kind: 'pants', c: ['#2A4064', '#18243A'] }],
      [{ name: 'Retro Sneaker', kind: 'shoe', c: ['#3A3D46', '#23252C'] }, { name: 'Running Shoes', kind: 'shoe', c: ['#2E3B4E', '#1A222E'] }]
    ];
    const heights = [150, 160, 110];
    const step = (row, d) => () => {
      const i = this.state.i.slice();
      i[row] = (i[row] + d + sets[row].length) % sets[row].length;
      this.setState({ i });
    };
    const rows = sets.map((list, row) => {
      const it = list[this.state.i[row]];
      return {
        name: it.name, pos: (this.state.i[row] + 1) + ' / ' + list.length,
        isShirt: it.kind === 'shirt', isPants: it.kind === 'pants', isShoe: it.kind === 'shoe',
        prev: step(row, -1), next: step(row, 1),
        box: 'position: relative; flex: 1; height: ' + heights[row] + 'px; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 1px solid #2C303B; background: radial-gradient(circle at 30% 25%, ' + it.c[0] + ', ' + it.c[1] + ')'
      };
    });
    const roll = () => this.setState({ i: sets.map(l => Math.floor(Math.random() * l.length)) });
    const loud = rows.filter(r => r.name === 'Heimtrikot').length;
    const hint = loud ? 'Eine Signalfarbe, Rest neutral: passt' : 'Ruhige Farben: passt immer';
    return { rows, roll, hint };
  }
}
</script>
</body>
</html>
