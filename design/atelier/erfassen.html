<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Teil erfassen · Atelier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8363C}a:hover{color:#9E2328}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: Inter, sans-serif; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s">
  <div style="padding: 20px 20px 10px; display: flex; align-items: center; justify-content: space-between">
    <a href="schrank.html" aria-label="Zurück zum Schrank" style="width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Neues Teil</h1>
    <button onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
      </sc-if>
    </button>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 6px 20px 20px; display: flex; flex-direction: column; gap: 18px">
    <div style="{{photo}}">
      <svg width="150" height="150" viewBox="0 0 24 24" fill="none" stroke="{{garment}}" stroke-width="1.1" stroke-linejoin="round" aria-hidden="true"><path d="M8 3L3 5.5 1.5 10.5 5 11.5V21h14v-9.5l3.5-1L21 5.5 16 3c0 2-1.8 3.2-4 3.2S8 5 8 3z"></path><path d="M9.5 8v13M14.5 8v13"></path></svg>
      <div style="position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; justify-content: space-between; align-items: center">
        <span style="display: flex; gap: 6px; align-items: center; background: var(--card); color: var(--ink); font-size: 12px; font-weight: 600; padding: 6px 10px 6px 6px; border-radius: 999px">
          <span style="width: 18px; height: 18px; border-radius: 50%; background: #2A47A8"></span><span style="width: 18px; height: 18px; border-radius: 50%; background: #A8283F; margin-left: -10px; border: 2px solid var(--card)"></span>Blau · Granat</span>
        <button style="height: 44px; padding: 0 14px; border-radius: 999px; background: var(--card); border: 0; color: var(--ink); font: inherit; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Neu</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 600; color: var(--mute)">Kategorie</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
          <button onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--mute)">Größe
        <input value="M" style="height: 52px; box-sizing: border-box; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; padding: 0 16px"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--mute)">Kaufpreis
        <input value="35 €" style="height: 52px; box-sizing: border-box; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; padding: 0 16px"></label>
      <label style="grid-column: span 2; display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--mute)">Name
        <input value="Heimtrikot 23/24" style="height: 52px; box-sizing: border-box; border-radius: 16px; background: var(--card); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; padding: 0 16px"></label>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: var(--card2); border-radius: 999px; padding: 4px">
      <button onClick="{{keep}}" style="{{keepStyle}}">Behalten</button>
      <button onClick="{{sell}}" style="{{sellStyle}}">Verkaufen</button>
    </div>
  </div>
  <div style="padding: 10px 20px 28px">
    <a href="schrank.html" style="height: 60px; border-radius: 999px; background: var(--ink); color: var(--bg); display: flex; align-items: center; justify-content: center; gap: 10px; text-decoration: none; font-size: 16px; font-weight: 600">In den Schrank legen
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Hell","Dunkel"],"default":"Hell"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { dark: null, cat: 'Trikot', sell: true }; }
  renderVals() {
    const dark = this.state.dark ?? ((this.props.theme ?? 'Hell') === 'Dunkel');
    const T = dark
      ? { bg: '#101012', card: '#1B1B1F', card2: '#26262B', line: '#2F2F35', ink: '#F4F3EF', mute: '#A9A8B0', acc: '#FF6E6A', onacc: '#1A0B0B' }
      : { bg: '#F4F3EF', card: '#FFFFFF', card2: '#ECEAE4', line: '#E1DED6', ink: '#16161A', mute: '#5F5E66', acc: '#C8363C', onacc: '#FFFFFF' };
    const vars = Object.keys(T).map(k => '--' + k + ':' + T[k] + ';').join(' ');
    const cats = ['Oberteil', 'Hose', 'Schuhe', 'Trikot', 'Jacke', 'Extras'].map(l => ({
      label: l,
      pick: () => this.setState({ cat: l }),
      style: 'height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (l === this.state.cat ? 'background: var(--ink); color: var(--bg); border: 1px solid var(--ink)' : 'background: var(--card); color: var(--ink); border: 1px solid var(--line)')
    }));
    const seg = on => 'height: 48px; border-radius: 999px; border: 0; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; ' + (on ? 'background: var(--acc); color: var(--onacc)' : 'background: transparent; color: var(--mute)');
    return {
      vars, isDark: dark, isLight: !dark, cats,
      toggle: () => this.setState({ dark: !dark }),
      toggleLabel: dark ? 'Helles Design' : 'Dunkles Design',
      photo: 'position: relative; height: 290px; border-radius: 28px; display: flex; align-items: center; justify-content: center; background: ' + (dark ? '#1F2C55' : '#DCE4FB'),
      garment: dark ? '#9FB4F2' : '#2A47A8',
      keep: () => this.setState({ sell: false }), sell: () => this.setState({ sell: true }),
      keepStyle: seg(!this.state.sell), sellStyle: seg(this.state.sell)
    };
  }
}
</script>
</body>
</html>
