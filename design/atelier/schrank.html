<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mein Schrank · Atelier</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8363C}a:hover{color:#9E2328}
</style>
</helmet>
<div style="{{vars}} width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: Inter, sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden; transition: background 0.3s">
  <div style="padding: 26px 20px 8px; display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; font-weight: 500; color: var(--mute)">Sonntag · [SPITZNAME]</span>
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">Schrank<span style="color: var(--acc)">.</span></h1>
    </div>
    <button onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 48px; height: 48px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <sc-if value="{{isDark}}" hint-placeholder-val="{{false}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      </sc-if>
      <sc-if value="{{isLight}}" hint-placeholder-val="{{true}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg>
      </sc-if>
    </button>
  </div>
  <div style="padding: 12px 20px 14px; display: flex; gap: 10px; overflow-x: auto">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
      <button onClick="{{c.pick}}" style="{{c.style}}">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800; line-height: 1">{{c.n}}</span>
        <span style="font-size: 12px; font-weight: 600">{{c.label}}</span>
      </button>
    </sc-for>
  </div>
  <div style="flex: 1; overflow-y: auto; padding: 0 20px 130px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="5">
        <a href="anzeige.html" style="{{it.cell}}">
          <div style="{{it.photo}}">
            <sc-if value="{{it.isShirt}}" hint-placeholder-val="{{true}}">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="{{it.stroke}}" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M8 3L3 5.5 1.5 10.5 5 11.5V21h14v-9.5l3.5-1L21 5.5 16 3c0 2-1.8 3.2-4 3.2S8 5 8 3z"></path></svg>
            </sc-if>
            <sc-if value="{{it.isShoe}}" hint-placeholder-val="{{false}}">
              <svg width="68" height="68" viewBox="0 0 24 24" fill="none" stroke="{{it.stroke}}" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M2 17.5h20M2 17.5V9.5l4 1.5 3-3 2.5 2.5c3 1.5 7 1.5 9.5 3.5 1 .8 1 2.5 1 3.5"></path></svg>
            </sc-if>
            <sc-if value="{{it.isPants}}" hint-placeholder-val="{{false}}">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="{{it.stroke}}" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 2.5h11L19 21.5h-4.5L12 9.5l-2.5 12H5z"></path></svg>
            </sc-if>
            <sc-if value="{{it.sell}}" hint-placeholder-val="{{false}}">
              <span style="position: absolute; top: 10px; right: 10px; background: var(--acc); color: var(--onacc); font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px">Verkaufen</span>
            </sc-if>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 10px 4px 2px">
            <span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.name}}</span>
            <span style="font-size: 12px; color: var(--mute); flex: none">{{it.size}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 10px; align-items: center">
    <nav aria-label="Hauptnavigation" style="flex: 1; height: 64px; background: var(--ink); border-radius: 999px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 6px">
      <a href="schrank.html" aria-label="Schrank" style="height: 52px; border-radius: 999px; background: var(--bg); color: var(--ink); display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4a2 2 0 1 1 2 2c-1 0-2 .8-2 2v1M12 9L2.5 16.5c-.8.6-.4 2 .6 2h17.8c1 0 1.4-1.4.6-2z"></path></svg></a>
      <a href="outfit.html" aria-label="Outfits" style="height: 52px; display: flex; align-items: center; justify-content: center; color: var(--navmute)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect></svg></a>
      <a href="anzeige.html" aria-label="Verkaufen" style="height: 52px; display: flex; align-items: center; justify-content: center; color: var(--navmute)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8" r="1.5"></circle></svg></a>
      <a href="schrank.html" aria-label="Bilanz" style="height: 52px; display: flex; align-items: center; justify-content: center; color: var(--navmute)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></a>
    </nav>
    <a href="erfassen.html" aria-label="Neues Teil fotografieren" style="flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--acc); color: var(--onacc); display: flex; align-items: center; justify-content: center">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["Hell","Dunkel"],"default":"Hell"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { dark: null, filter: 'Alle' }; }
  renderVals() {
    const dark = this.state.dark ?? ((this.props.theme ?? 'Hell') === 'Dunkel');
    const T = dark
      ? { bg: '#101012', card: '#1B1B1F', card2: '#26262B', line: '#2F2F35', ink: '#F4F3EF', mute: '#A9A8B0', acc: '#FF6E6A', onacc: '#1A0B0B', navmute: '#6E6D75' }
      : { bg: '#F4F3EF', card: '#FFFFFF', card2: '#ECEAE4', line: '#E1DED6', ink: '#16161A', mute: '#5F5E66', acc: '#C8363C', onacc: '#FFFFFF', navmute: '#9C9BA3' };
    const vars = Object.keys(T).map(k => '--' + k + ':' + T[k] + ';').join(' ');
    const all = [
      { name: 'Heimtrikot 23/24', size: 'M', cat: 'Trikots', kind: 'shirt', l: '#DCE4FB', d: '#1F2C55', s: '#2A47A8', sd: '#9FB4F2', sell: true },
      { name: 'Retro Sneaker', size: '43', cat: 'Schuhe', kind: 'shoe', l: '#ECEAE4', d: '#2A2A2F', s: '#4A4952', sd: '#C9C8CF', sell: false },
      { name: 'Oversize Hoodie', size: 'L', cat: 'Oberteile', kind: 'shirt', l: '#E3E8D5', d: '#262C1C', s: '#56663A', sd: '#B5C38D', sell: false },
      { name: 'Cargo Pants', size: '32', cat: 'Hosen', kind: 'pants', l: '#E4E1DA', d: '#25252A', s: '#3D3C44', sd: '#B7B6BE', sell: false },
      { name: 'Auswärtstrikot', size: 'M', cat: 'Trikots', kind: 'shirt', l: '#F6EBC9', d: '#3A3013', s: '#9A7612', sd: '#E7C766', sell: true }
    ];
    const f = this.state.filter;
    const labels = ['Alle', 'Oberteile', 'Hosen', 'Schuhe', 'Trikots'];
    const cats = labels.map(l => {
      const on = l === f;
      return {
        label: l, n: l === 'Alle' ? all.length : all.filter(i => i.cat === l).length,
        pick: () => this.setState({ filter: l }),
        style: 'flex: none; min-width: 84px; height: 72px; padding: 0 14px; border-radius: 20px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; font: inherit; cursor: pointer; ' + (on ? 'background: var(--ink); color: var(--bg); border: 1px solid var(--ink)' : 'background: var(--card); color: var(--ink); border: 1px solid var(--line)')
      };
    });
    const shown = all.filter(i => f === 'Alle' || i.cat === f);
    const items = shown.map((i, idx) => {
      const big = idx === 0;
      return {
        ...i,
        isShirt: i.kind === 'shirt', isShoe: i.kind === 'shoe', isPants: i.kind === 'pants',
        stroke: dark ? i.sd : i.s,
        cell: 'text-decoration: none; color: var(--ink); display: flex; flex-direction: column;' + (big ? ' grid-column: span 2;' : ''),
        photo: 'position: relative; height: ' + (big ? 190 : 160) + 'px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: ' + (dark ? i.d : i.l)
      };
    });
    return {
      vars, isDark: dark, isLight: !dark, cats, items,
      toggle: () => this.setState({ dark: !dark }),
      toggleLabel: dark ? 'Helles Design' : 'Dunkles Design'
    };
  }
}
</script>
</body>
</html>
